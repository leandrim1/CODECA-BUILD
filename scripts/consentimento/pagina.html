<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Prova</title></head>
<body>
  <h1>Site de prova</h1>
  <script type="text/plain" data-codeca-consent="estatisticas"
          data-codeca-src="https://www.googletagmanager.com/gtag/js?id=G-PROVA"></script>
  <iframe data-codeca-consent="marketing" data-codeca-src="https://www.youtube.com/embed/dQw4w9WgXcQ"
          width="320" height="180" title="video"></iframe>
  <p><button type="button" id="preferencias">Configurações de cookies</button></p>
  <script type="module">
    import { createConsentManager, aplicarConsentimento, montarConsentimento }
      from './sdk/consent-entry.js';
    const manager = createConsentManager({ policyVersion: '2026-11-21' });
    aplicarConsentimento(manager);
    const ui = montarConsentimento({
      manager,
      controlador: 'Clínica Sorriso Ltda.',
      politicaDeCookies: '/politica-de-cookies',
      politicaDePrivacidade: '/politica-de-privacidade',
    });
    document.getElementById('preferencias').addEventListener('click', ui.abrirPreferencias);
    window.__manager = manager;
  </script>
</body></html>
