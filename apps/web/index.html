<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D4ED8" />
    <meta
      name="description"
      content="Painel de conteudo para sites desenvolvidos sob medida pela CODECA IA. A empresa atualiza textos, imagens e listas do proprio ramo sem novo deploy."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Codeca Build | Painel de conteudo do seu site</title>
    <style>
      /* Mesmo fundo e mesmo espinner da tela de espera do React: a passagem do
         HTML inicial para o painel nao deve ser vista. */
      html, body { background: #f8fafc; }
      @keyframes boot-giro { to { transform: rotate(360deg); } }
      .boot-giro {
        width: 16px; height: 16px; border-radius: 9999px;
        border: 2px solid #cbd5e1; border-top-color: #1d4ed8;
        animation: boot-giro 1s linear infinite;
      }
    </style>
  </head>
  <body>
    <!--
      Conteudo de partida dentro do #root.

      O React o substitui ao montar. Ele existe para o caso que o
      `ErrorBoundary` nao alcanca: quando o proprio bundle nao executa -- 404
      no arquivo, tipo MIME errado, erro de sintaxe. Ai nao ha React para
      capturar nada, e sem isto a pagina fica branca e muda, indistinguivel de
      um erro de renderizacao.

      Com isto, as duas falhas ficam diferentes a olho nu: texto de
      carregamento parado = o bundle nao rodou; tela de erro = o codigo
      quebrou.
    -->
    <div id="root">
      <div id="boot" style="min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:'Inter var',Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#64748b">
        <div style="max-width:32rem;display:grid;gap:12px;justify-items:center;text-align:center">
          <span id="boot-giro" class="boot-giro" role="status" aria-label="Carregando"></span>
          <p id="boot-msg" style="margin:0;font-size:14px;line-height:20px">Carregando o painel...</p>
          <div id="boot-falha" style="display:none;gap:12px">
            <h1 style="font-size:1.25rem;font-weight:600;margin:0;color:#0f172a">
              Nao foi possivel carregar o painel
            </h1>
            <p style="margin:0;line-height:1.5">
              Os arquivos da aplicacao nao chegaram ao navegador. Quase sempre e cache de uma
              versao anterior: recarregue sem cache (Ctrl+F5) ou abra em uma janela anonima.
              Se continuar, avise a CODECA IA -- pode ser uma publicacao incompleta.
            </p>
            <noscript>
              Este painel precisa de JavaScript habilitado.
            </noscript>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Se em 12s o React nao substituiu o conteudo, o bundle nao rodou.
      // Trocar a mensagem e melhor do que deixar "Carregando..." para sempre.
      setTimeout(function () {
        var falha = document.getElementById('boot-falha');
        var msg = document.getElementById('boot-msg');
        if (!falha || !document.getElementById('boot')) return;
        falha.style.display = 'grid';
        var giro = document.getElementById('boot-giro');
        if (giro) giro.remove();
        if (msg) msg.remove();
      }, 12000);
    </script>
  </body>
</html>
