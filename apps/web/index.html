<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D4ED8" />
    <title>CODECA Build | Gestão de Conteúdo para Sites Empresariais</title>
    <meta
      name="description"
      content="Sites empresariais sob medida, com uma plataforma profissional para gerenciar conteúdos, imagens, produtos, serviços e informações do seu negócio."
    />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Metadados da pagina inicial. Sao o que um rastreador ou uma previa de link
      (WhatsApp, LinkedIn, Slack) le: nenhum deles executa o JavaScript do
      aplicativo. Dentro do aplicativo, `RouteMeta` ajusta titulo e indexacao
      por rota.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="CODECA Build" />
    <meta property="og:title" content="CODECA Build | Gestão de Conteúdo para Sites Empresariais" />
    <meta
      property="og:description"
      content="Sites empresariais sob medida, com uma plataforma profissional para gerenciar conteúdos, imagens, produtos, serviços e informações do seu negócio."
    />
    <meta property="og:image:alt" content="Painel do CODECA Build: menu por módulos, indicadores de conteúdo e situação do site." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CODECA Build | Gestão de Conteúdo para Sites Empresariais" />
    <meta
      name="twitter:description"
      content="Sites empresariais sob medida, com uma plataforma profissional para gerenciar conteúdos, imagens, produtos, serviços e informações do seu negócio."
    />
    <!--codeca:seo-url-->
    <script>
      /*
        Tema antes da primeira pintura.

        Sem isto o navegador pinta o painel claro e so depois o React troca
        para escuro -- o flash branco que o usuario leva na cara a cada
        carregamento. Aqui nao ha React ainda: e um roteiro sincrono no <head>,
        que roda antes de qualquer pixel.

        So no painel: a pagina publica foi desenhada em claro e o painel mestre
        ja e escuro. A chave e o prefixo repetem o que `useTheme.tsx` usa --
        mudar em um exige mudar no outro.

        Tudo dentro de try: em navegacao privada o localStorage pode lancar, e
        uma excecao aqui deixaria a pagina sem nada renderizado.
      */
      (function () {
        try {
          if (location.pathname.indexOf('/painel') !== 0) return;
          var pref = localStorage.getItem('codeca:tema') || 'sistema';
          var escuro =
            pref === 'escuro' ||
            (pref === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (escuro) document.documentElement.classList.add('dark');
        } catch (e) {
          /* Sem preferencia legivel, fica o tema claro. */
        }
      })();
    </script>
    <style>
      /* Mesmo fundo e mesmo espinner da tela de espera do React: a passagem do
         HTML inicial para o painel nao deve ser vista. */
      html, body { background: #f8fafc; }
      /* O mesmo, no escuro: o fundo de partida tem de ser o fundo do painel,
         senao a tela de espera pisca branca antes do painel escuro aparecer. */
      html.dark, html.dark body { background: #0b1120; color-scheme: dark; }
      html.dark .boot-giro { border-color: #334155; border-top-color: #60a5fa; }
      @keyframes boot-giro { to { transform: rotate(360deg); } }
      .boot-giro {
        width: 16px; height: 16px; border-radius: 9999px;
        border: 2px solid #cbd5e1; border-top-color: #1d4ed8;
        animation: boot-giro 1s linear infinite;
      }
    </style>
  </head>
  <body>
    <!--
      Conteudo de partida dentro do #root.

      O React o substitui ao montar. Ele existe para o caso que o
      `ErrorBoundary` nao alcanca: quando o proprio bundle nao executa -- 404
      no arquivo, tipo MIME errado, erro de sintaxe. Ai nao ha React para
      capturar nada, e sem isto a pagina fica branca e muda, indistinguivel de
      um erro de renderizacao.

      Com isto, as duas falhas ficam diferentes a olho nu: texto de
      carregamento parado = o bundle nao rodou; tela de erro = o codigo
      quebrou.
    -->
    <div id="root">
      <div id="boot" style="min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:'Inter var',Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#64748b">
        <div style="max-width:32rem;display:grid;gap:12px;justify-items:center;text-align:center">
          <span id="boot-giro" class="boot-giro" role="status" aria-label="Carregando"></span>
          <p id="boot-msg" style="margin:0;font-size:14px;line-height:20px">Carregando...</p>
          <div id="boot-falha" style="display:none;gap:12px">
            <h1 style="font-size:1.25rem;font-weight:600;margin:0;color:#0f172a">
              Nao foi possivel carregar o painel
            </h1>
            <p style="margin:0;line-height:1.5">
              Os arquivos da aplicacao nao chegaram ao navegador. Quase sempre e cache de uma
              versao anterior: recarregue sem cache (Ctrl+F5) ou abra em uma janela anonima.
              Se continuar, avise a CODECA IA -- pode ser uma publicacao incompleta.
            </p>
            <noscript>
              Este painel precisa de JavaScript habilitado.
            </noscript>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Se em 12s o React nao substituiu o conteudo, o bundle nao rodou.
      // Trocar a mensagem e melhor do que deixar "Carregando..." para sempre.
      setTimeout(function () {
        var falha = document.getElementById('boot-falha');
        var msg = document.getElementById('boot-msg');
        if (!falha || !document.getElementById('boot')) return;
        falha.style.display = 'grid';
        var giro = document.getElementById('boot-giro');
        if (giro) giro.remove();
        if (msg) msg.remove();
      }, 12000);
    </script>
  </body>
</html>
